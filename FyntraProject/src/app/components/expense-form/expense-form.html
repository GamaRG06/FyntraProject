<div class="backdrop" (click)="close.emit()">
  <section
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="form-title"
    (click)="$event.stopPropagation()"
    (keydown.escape)="close.emit()"
  >
    <div class="modal-heading">
      <h2 id="form-title">Un nuevo gasto en tu plan</h2>
      <button aria-label="Cerrar" (click)="close.emit()">×</button>
    </div>
    <p>Reserva un lugar para lo que viene.</p>
    <form (ngSubmit)="save()">
      <label
        >Nombre del gasto<input
          name="name"
          [(ngModel)]="draft.name"
          placeholder="Ej. Internet en casa"
          required
          maxlength="80"
      /></label>
      <div class="form-columns">
        <label
          >Monto (MXN)<input
            name="amount"
            type="number"
            [(ngModel)]="draft.amount"
            min="0.01"
            step="0.01"
            required
            placeholder="0.00" /></label
        ><label
          >Fecha prevista<input name="date" type="date" [(ngModel)]="draft.date" required
        /></label>
      </div>
      <label
        >Categoría<select name="category" [(ngModel)]="draft.category">
          @for (c of categories(); track c) {
            <option>{{ c }}</option>
          }
        </select></label
      >
      <p class="form-note">Plantilla de ejemplo: los cambios duran hasta recargar la página.</p>
      <button class="primary" type="submit">Agregar a mi plan</button>
    </form>
  </section>
</div>
