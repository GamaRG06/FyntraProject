<div class="shell">
  <app-sidebar
    [section]="section()"
    [expenseCount]="monthly().length"
    (sectionChange)="section.set($event)"
  />
  <main>
    <app-topbar [section]="section()" />
    <div class="content">
      <app-page-heading [section]="section()" (newExpense)="openForm()" />
      <app-month-selector [monthLabel]="monthLabel()" (monthChange)="shiftMonth($event)" />
      @if (section() === 'Resumen') {
        <app-monthly-summary
          [total]="total()"
          [paid]="paid()"
          [expenseCount]="monthly().length"
          [pendingCount]="pending().length"
        />
      }
      <div class="grid" [class.wide]="section() !== 'Resumen'">
        @if (section() !== 'Categorías') {
          <app-expense-list
            [expenses]="monthly()"
            [monthLabel]="monthLabel()"
            [filter]="filter()"
            (filterChange)="filter.set($event)"
            (toggleExpense)="toggle($event)"
            (newExpense)="openForm()"
          />
        }
        @if (section() !== 'Mis gastos') {
          <app-category-breakdown [categories]="categories" [expenses]="monthly()" />
        }
      </div>
      <app-planning-note />
      <app-footer />
    </div>
  </main>
</div>
@if (showForm()) {
  <app-expense-form
    [categories]="categories"
    [month]="month()"
    (close)="showForm.set(false)"
    (saveExpense)="save($event)"
  />
}
